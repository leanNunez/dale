# Model prices for the cost per verified order (design §7 and §10, tasks 8a.4 and 13.3, B89).
# US dollars per million tokens (MTok); the cost formula is in evals/harness/pricing.py.
# One table per compared model, each with its own source, retrieval date and note: a model with
# no table here has no cost, and its report is refused instead of borrowing another model's
# prices (S14.4). A request whose prompt (input + cache writes + cache reads) is over the
# threshold uses [long_context]; every other request uses [standard].
#
# Every price below was read from the live pricing page, never from memory (R16, task 9.4).
# On the day of the record runs, re-check both tables, update `retrieved` and the notes, and
# COMMIT that change first: that commit is the record commit both models run on, the same day
# (tasks 9.8 and 9.9). A record run reads the tree as dirty for any change outside
# evals/recordings and evals/reports, so an uncommitted edit here gets the reports refused by the
# comparison after the runs are paid for, and a commit between the two runs splits their commits.

[models."claude-haiku-5-5"]
long_context_threshold_tokens = 100_000

[models."claude-haiku-5-5".source]
url = "https://platform.claude.com/docs/en/about-claude/pricing"
retrieved = "2026-11-26"
# Printed in every report.
note = """Checked against the live page on 2026-11-26 (first checked 2026-11-16, unchanged): \
the eight Haiku 5.5 prices, the 100,000-token threshold (the prompt counts input, cache writes \
and cache reads) and the 5-minute cache write all match. The recordings use only 5-minute cache \
writes, so no 1-hour price is needed. Run-day check 2026-11-26: unchanged."""

[models."claude-haiku-5-5".standard]  # prompts of 100,000 tokens or fewer
input = 0.10
output = 0.50
cache_write_5m = 0.125
cache_read = 0.01

[models."claude-haiku-5-5".long_context]  # prompts of more than 100,000 tokens
input = 0.50
output = 2.50
cache_write_5m = 0.625
cache_read = 0.05

[models."claude-sonnet-5-5"]
# The page prices Sonnet 5.5 the same over its whole context window: there is no long-context
# tier, so [long_context] repeats [standard] and the threshold is the 1M-token window.
long_context_threshold_tokens = 1_000_000

[models."claude-sonnet-5-5".source]
url = "https://platform.claude.com/docs/en/about-claude/pricing"
retrieved = "2026-11-26"
note = """Read from the live page on 2026-11-26: Sonnet 5.5 base input 2 USD/MTok, 5-minute \
cache write 2.50, cache hits 0.10 (0.05x the input price, not the usual 0.1x), output 10. The \
page states that the full 1M-token window is billed at standard prices, so both tiers are the \
same. The 1-hour cache write (4) is not needed. Run-day check 2026-11-26: unchanged."""

[models."claude-sonnet-5-5".standard]
input = 2.00
output = 10.00
cache_write_5m = 2.50
cache_read = 0.10

[models."claude-sonnet-5-5".long_context]  # the same prices: no long-context tier
input = 2.00
output = 10.00
cache_write_5m = 2.50
cache_read = 0.10
